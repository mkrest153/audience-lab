# Render Blueprint — Audience Lab 편집국 서비스 (Docker 한 서비스)
# 사용: Render 대시보드 → New → Blueprint → 이 저장소 → Apply
#
# 지금은 무료 플랜(free)이다. 결제 수단 없이 동작하는 대신:
#   - 15분 동안 접속이 없으면 잠들고, 다음 접속 때 깨어나는 데 1분쯤 걸린다
#   - 디스크를 붙일 수 없어 다시 시작·배포·잠들기 때마다 기록(초대 계정, 기획, 보고서)이 지워진다
#     관리자 계정과 시연 공간은 부팅할 때 다시 만들어진다
# 기록을 남기려면 plan을 0.5c-512mb(월 $7)로 바꾸고 아래 disk 블록의 주석을 풀고(월 $0.25/GB),
# EPHEMERAL_STORAGE를 "0"으로 바꾼다. 모델 사용료는 연결한 OpenAI 계정에 따로 청구된다.
services:
  - type: web
    name: audience-lab
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - homepage/**
        - "**/*.md"
    # disk:
    #   name: audience-lab-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false            # 대시보드에서 직접 입력 (sk-…)
      - key: ADMIN_EMAIL
        sync: false            # 첫 관리자 계정의 로그인 이메일
      - key: ADMIN_PASSWORD
        sync: false            # 첫 관리자 비밀번호
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: DATA_DIR
        value: /var/data
      - key: EPHEMERAL_STORAGE
        value: "1"             # 화면에 '다시 시작하면 기록이 지워진다'는 안내를 띄운다
      - key: DAILY_MODEL_CALL_LIMIT
        value: "300"
      - key: DAILY_SEARCH_CALL_LIMIT
        value: "80"
